# テンプレート製（make pull-conf では上書きされない。README「etc/ の中身」）
# alp 用の LTSV ログ（http コンテキストで読み込まれる）
# nginx.conf の access_log は消しておく（log_format より前に書かれていると ltsv が未定義エラーになり、残すと二重に出力される）
# 提出前は下の access_log を access_log off; にする
log_format ltsv "time:$time_local"
                "\thost:$remote_addr"
                "\tforwardedfor:$http_x_forwarded_for"
                "\treq:$request"
                "\tmethod:$request_method"
                "\turi:$request_uri"
                "\tstatus:$status"
                "\tsize:$body_bytes_sent"
                "\treferer:$http_referer"
                "\tua:$http_user_agent"
                "\treqtime:$request_time"
                "\tapptime:$upstream_response_time"
                "\tcache:$upstream_http_x_cache"
                "\tvhost:$host";
access_log /var/log/nginx/access.log ltsv;
